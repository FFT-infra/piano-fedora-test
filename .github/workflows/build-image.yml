name: build-image

# 从 Fedora rootfs 制作可刷写的 F2FS root 镜像。
#
# 单 job 完成：下载 rootfs 与内核 → 写 F2FS 策略 → 装模块与硬件入口
# → 制镜像 → 读回核对 → 打包上传。
# 不跨 job 搬大文件。F2FS 需要内核模块，这里先装 linux-modules-extra。
on:
  workflow_dispatch:
    inputs:
      rootfs_artifact:
        description: "rootfs artifact 名，例如 rootfs-44-gnome"
        required: true
        default: "rootfs-44-gnome"
      kernel_artifact:
        description: "内核 artifact 名（模块要装进 rootfs）"
        required: true
        default: "kernel-release-7.2.9"
      size_mib:
        description: "root 镜像容量（MiB）"
        required: false
        default: "8192"

permissions:
  contents: read

jobs:
  image:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Install tools
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq f2fs-tools attr zstd binutils python3
          # f2fs 挂载需要内核模块，默认不带。
          KREL="$(uname -r)"
          sudo apt-get install -y -qq "linux-modules-extra-${KREL}" 2>/dev/null \
            || sudo apt-get install -y -qq linux-modules-extra-azure 2>/dev/null \
            || echo "no modules-extra matched"
          sudo modprobe f2fs 2>&1 || true
          if ! grep -qw f2fs /proc/filesystems; then
            echo "::error::kernel cannot mount f2fs; image build needs it"
            exit 1
          fi
          echo "f2fs mountable"

      - name: Find the runs that produced the artifacts
        id: source
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # download-artifact 默认只看当前 run。rootfs 与内核由另外的 run
          # 产出，所以要显式找到各自的 run id。
          find_run() {
            local wf="$1" name="$2"
            for id in $(gh run list --workflow="$wf" --limit 20 --json databaseId --jq '.[].databaseId'); do
              if gh api "repos/${{ github.repository }}/actions/runs/$id/artifacts" \
                   --jq ".artifacts[].name" 2>/dev/null | grep -qx "$name"; then
                echo "$id"; return 0
              fi
            done
            return 1
          }
          RID=$(find_run build-rootfs.yml "${{ inputs.rootfs_artifact }}") \
            || { echo "::error::rootfs artifact not found"; exit 1; }
          KID=$(find_run build-kernel.yml "${{ inputs.kernel_artifact }}") \
            || { echo "::error::kernel artifact not found"; exit 1; }
          echo "run_id=$RID" >> "$GITHUB_OUTPUT"
          echo "kernel_run_id=$KID" >> "$GITHUB_OUTPUT"
          echo "using rootfs run $RID, kernel run $KID"

      - name: Download rootfs
        uses: actions/download-artifact@v4
        with:
          name: ${{ inputs.rootfs_artifact }}
          path: incoming
          run-id: ${{ steps.source.outputs.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Download kernel
        uses: actions/download-artifact@v4
        with:
          name: ${{ inputs.kernel_artifact }}
          path: stage/kernel
          run-id: ${{ steps.source.outputs.kernel_run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Unpack rootfs
        run: |
          set -euo pipefail
          mkdir -p work
          sudo tar -I zstd -xf incoming/*.tar.zst -C work
          test -d work/rootfs
          sudo du -sh work/rootfs
          # 内核 artifact 里是一层 tar.zst。
          tar -I zstd -xf stage/kernel/*.tar.zst -C stage/kernel
          test -f stage/kernel/manifest.json

      - name: Apply the F2FS rootfs policy
        run: |
          set -euo pipefail
          # fstab、udev 放行和关机 hook 都要是 F2FS 版本，且必须在制镜像
          # 之前写进去，否则镜像里的挂载策略还是 ext4 的。
          sudo python3 scripts/apply-rootfs-policy.py \
            --rootfs work/rootfs \
            --manifest rootfs-policy.json
          cat rootfs-policy.json

      - name: Stage kernel modules and the piano hardware entry
        run: |
          set -euo pipefail
          # 引导脚本要求 rootfs 里有匹配 release 的模块和
          # /usr/lib/piano/piano-disk-hardware-prepare，缺一个就进救援。
          # 模块来自内核 artifact，硬件入口来自固定 commit 的 SunUEFI。
          python3 - <<'PY' >> "$GITHUB_ENV"
          import json
          lock = json.load(open("sources.lock.json"))["sources"]
          print("SUNUEFI_URL=" + lock["sunuefi"]["url"])
          print("SUNUEFI_COMMIT=" + lock["sunuefi"]["commit"])
          PY
          git clone --filter=blob:none "$SUNUEFI_URL" sunuefi
          git -C sunuefi checkout "$SUNUEFI_COMMIT"
          python3 scripts/apply-patches.py --sunuefi sunuefi
          sudo python3 scripts/stage-rootfs-payload.py \
            --rootfs work/rootfs \
            --kernel stage/kernel \
            --sunuefi sunuefi \
            --manifest rootfs-payload.json
          cat rootfs-payload.json

      - name: Build F2FS root image
        run: |
          set -euo pipefail
          sudo python3 scripts/build-f2fs-image.py \
            --rootfs work/rootfs \
            --size-mib "${{ inputs.size_mib }}" \
            --output "pianoroot-${{ inputs.size_mib }}.f2fs.img" \
            --verify \
            --manifest root-image-manifest.json
          cat root-image-manifest.json

      - name: Report image size
        run: |
          set -euo pipefail
          ls -lh pianoroot-*.f2fs.img
          echo "apparent: $(stat -c%s pianoroot-*.f2fs.img) bytes"
          echo "on-disk:  $(du -h --apparent-size pianoroot-*.f2fs.img | cut -f1)"

      - name: Compress image
        run: |
          set -euo pipefail
          # 镜像大部分是空块，zstd 压得动。
          zstd -10 -T0 --force -o "pianoroot-${{ inputs.size_mib }}.f2fs.img.zst" pianoroot-*.f2fs.img
          ls -lh pianoroot-*.f2fs.img.zst

      - uses: actions/upload-artifact@v4
        with:
          name: root-image-${{ inputs.size_mib }}
          path: |
            pianoroot-*.f2fs.img.zst
            root-image-manifest.json
            rootfs-policy.json
            rootfs-payload.json
          retention-days: 14
          compression-level: 1
