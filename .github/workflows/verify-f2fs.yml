name: verify-tools

# 在 CI 上验证镜像工具的实际行为，并如实记录边界。
#
# f2fs 部分：GitHub runner 的内核默认不带 f2fs 模块，装上
# linux-modules-extra 后可以挂载，这里做真实的往返验证。
#
# 已实测的边界：
#   sload.f2fs -P  保留 owner 与 setuid，但不保留 user xattr。
#   挂载 + tar --xattrs 能保留 xattr，是制镜像采用的路径。
on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  capability:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Install tools
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq f2fs-tools attr dosfstools mtools

      - name: Try to install the kernel f2fs module
        run: |
          set -euo pipefail
          KREL="$(uname -r)"
          # Azure 内核的额外模块常放在 linux-modules-extra 里。
          sudo apt-get install -y -qq "linux-modules-extra-${KREL}" 2>/dev/null \
            || sudo apt-get install -y -qq linux-modules-extra-azure 2>/dev/null \
            || echo "no modules-extra package matched"
          sudo modprobe f2fs 2>&1 || true
          echo "--- after install ---"
          grep -cw f2fs /proc/filesystems || echo "still no f2fs"
          modinfo f2fs 2>&1 | head -3 || true

      - name: Report kernel and tool capabilities
        run: |
          set -euo pipefail
          echo "kernel: $(uname -r)"
          echo "f2fs in /proc/filesystems: $(grep -cw f2fs /proc/filesystems || true)"
          for tool in mkfs.f2fs fsck.f2fs sload.f2fs dump.f2fs; do
            echo "$tool: $(command -v $tool || echo MISSING)"
          done

      - name: Build fixture
        run: |
          set -euo pipefail
          mkdir -p fixture/etc fixture/usr/bin fixture/home/user
          printf 'ID=fedora\nVERSION_ID=44\n' > fixture/etc/os-release
          printf '#!/bin/sh\necho hello\n' > fixture/usr/bin/hello
          chmod 4755 fixture/usr/bin/hello
          ln -sf ../usr/bin/hello fixture/home/user/link
          setfattr -n user.codex.test -v roundtrip fixture/etc/os-release
          ls -l fixture/usr/bin/hello
          getfattr -d fixture/etc/os-release

      - name: Offline import with sload (no mount needed)
        run: |
          set -euo pipefail
          truncate -s 64M sload.f2fs.img
          mkfs.f2fs -f -l PIANOROOT sload.f2fs.img
          sload.f2fs -P -f fixture sload.f2fs.img
          fsck.f2fs -f sload.f2fs.img
          echo "sload import completed; see docs for what it does not preserve"

      - name: Try mount-based import (skip when kernel lacks f2fs)
        run: |
          set -euo pipefail
          if grep -qw f2fs /proc/filesystems; then
            echo "kernel reports f2fs support; running the mount roundtrip"
            sudo python3 scripts/build-f2fs-image.py \
              --rootfs fixture \
              --size-mib 64 \
              --output mount.f2fs.img \
              --verify \
              --manifest f2fs-manifest.json
            cat f2fs-manifest.json
          else
            echo "runner kernel does not list f2fs; the mount roundtrip cannot run here."
            printf '{"status":"SKIPPED_NO_KERNEL_F2FS","reason":"kernel does not list f2fs in /proc/filesystems"}\n' > f2fs-manifest.json
            cat f2fs-manifest.json
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: tool-manifests
          path: |
            f2fs-manifest.json
            esp-manifest.json
          retention-days: 7

  esp:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Install ESP tools
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq dosfstools mtools python3

      - name: Build a fixture ESP and read it back
        run: |
          set -euo pipefail
          mkdir -p fixture
          printf 'MZfake-efi-application' > fixture/BOOTAA64.EFI
          printf 'fake-kernel-image' > fixture/Image
          printf 'fake-dtb' > fixture/piano.dtb
          python3 scripts/build-esp-image.py \
            --size-mib 64 \
            --label SUNUEFI_ESP \
            --file "EFI/BOOT/BOOTAA64.EFI:fixture/BOOTAA64.EFI" \
            --file "Image:fixture/Image" \
            --file "piano.dtb:fixture/piano.dtb" \
            --output esp.img \
            --manifest esp-manifest.json
          cat esp-manifest.json
          # 从镜像里读回，确认文件真的写进去了。
          mdir -i esp.img -/ -b
          for name in EFI/BOOT/BOOTAA64.EFI Image piano.dtb; do
            mtype -i esp.img "::/$name" > /dev/null || { echo "::error::$name missing from ESP"; exit 1; }
          done
          echo "ESP roundtrip OK"
