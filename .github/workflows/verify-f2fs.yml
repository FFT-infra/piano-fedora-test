name: verify-f2fs

# 在 CI 上验证 f2fs 工具链的实际能力，并如实记录边界。
#
# GitHub runner 的内核（6.17.0-1022-azure）没有 f2fs 模块，
# /proc/filesystems 里没有 f2fs，所以无法挂载镜像。
# 因此这里不假装能做完整镜像，只验证离线工具能做什么、不能做什么。
#
# 已实测的边界：
#   sload.f2fs -P  保留 owner 与 setuid，但不保留 user xattr。
#   挂载 + tar --xattrs 能保留 xattr，但需要内核支持，CI 上做不到。
#
# 结论：完整 F2FS 镜像在支持挂载的环境生成（本地或自托管 runner），
# CI 负责验证工具行为与离线可做的部分。
on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  capability:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Install f2fs-tools
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq f2fs-tools attr

      - name: Report kernel and tool capabilities
        run: |
          set -euo pipefail
          echo "kernel: $(uname -r)"
          echo "f2fs in /proc/filesystems: $(grep -cw f2fs /proc/filesystems || true)"
          for tool in mkfs.f2fs fsck.f2fs sload.f2fs dump.f2fs; do
            echo "$tool: $(command -v $tool || echo MISSING)"
          done

      - name: Build fixture
        run: |
          set -euo pipefail
          mkdir -p fixture/etc fixture/usr/bin fixture/home/user
          printf 'ID=fedora\nVERSION_ID=44\n' > fixture/etc/os-release
          printf '#!/bin/sh\necho hello\n' > fixture/usr/bin/hello
          chmod 4755 fixture/usr/bin/hello
          ln -sf ../usr/bin/hello fixture/home/user/link
          setfattr -n user.codex.test -v roundtrip fixture/etc/os-release
          ls -l fixture/usr/bin/hello
          getfattr -d fixture/etc/os-release

      - name: Offline import with sload (no mount needed)
        run: |
          set -euo pipefail
          truncate -s 64M sload.f2fs.img
          mkfs.f2fs -f -l PIANOROOT sload.f2fs.img
          sload.f2fs -P -f fixture sload.f2fs.img
          fsck.f2fs -f sload.f2fs.img
          echo "sload import completed; see docs for what it does not preserve"

      - name: Try mount-based import (skip when kernel lacks f2fs)
        run: |
          set -euo pipefail
          if grep -qw f2fs /proc/filesystems; then
            sudo python3 scripts/build-f2fs-image.py \
              --rootfs fixture \
              --size-mib 64 \
              --output mount.f2fs.img \
              --verify \
              --manifest f2fs-manifest.json
            cat f2fs-manifest.json
          else
            echo "SKIPPED: runner kernel has no f2fs support."
            echo "Mount-based import must run where f2fs can be mounted."
            printf '{"status":"SKIPPED_NO_KERNEL_F2FS","reason":"runner kernel lacks f2fs"}\n' > f2fs-manifest.json
            cat f2fs-manifest.json
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: f2fs-manifest
          path: f2fs-manifest.json
          retention-days: 7
