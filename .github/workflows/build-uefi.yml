name: build-uefi

# 按 sources.lock.json 取 SunUEFI，构建 piano 的 UEFI 产品固件。
#
# 用 x86_64 runner：SunUEFI 的宿主机工具链是从 Debian amd64 提取的固定包
# （qemu-user、proot、libtalloc2），arm64 runner 上不适用。
#
# 不接触设备。
on:
  workflow_dispatch:
    inputs:
      sunuefi_ref:
        description: "SunUEFI ref（留空则用 sources.lock.json 的 commit）"
        required: false
        default: ""

permissions:
  contents: read

jobs:
  uefi:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      - name: Read pinned commits
        id: pins
        run: |
          set -euo pipefail
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          lock = json.load(open("sources.lock.json"))["sources"]
          print("sunuefi_url=" + lock["sunuefi"]["url"])
          print("sunuefi_commit=" + lock["sunuefi"]["commit"])
          PY
          cat "$GITHUB_OUTPUT"

      # 用 SunUEFI 官方的构建容器，而不是逐个补宿主依赖。
      # containers/Dockerfile 已列全所需包，包括 gettext、fonts-noto-cjk、
      # gcc/binutils-aarch64-linux-gnu、acpica-tools、mtools、dosfstools。
      # 手工装包会在长构建中途才暴露缺项，逐个试错代价高。
      - name: Build the official builder image
        run: |
          set -euo pipefail
          git clone --depth 1 "${{ steps.pins.outputs.sunuefi_url }}" sunuefi-image
          git -C sunuefi-image fetch --depth 1 origin "${{ steps.pins.outputs.sunuefi_commit }}"
          git -C sunuefi-image checkout FETCH_HEAD
          docker build -t sunuefi-builder -f sunuefi-image/containers/Dockerfile sunuefi-image

      - name: Clone SunUEFI at the pinned commit
        run: |
          set -euo pipefail
          REF="${{ inputs.sunuefi_ref }}"
          [ -n "$REF" ] || REF="${{ steps.pins.outputs.sunuefi_commit }}"
          git clone "${{ steps.pins.outputs.sunuefi_url }}" sunuefi
          git -C sunuefi checkout "$REF"
          echo "sunuefi at $(git -C sunuefi rev-parse HEAD)"

      - name: Apply project patches to SunUEFI
        run: |
          set -euo pipefail
          python3 scripts/apply-patches.py --sunuefi sunuefi

      - name: Build UEFI product firmware in the container
        run: |
          set -euo pipefail
          docker run --rm \
            -v "$GITHUB_WORKSPACE/sunuefi:/workspace" \
            -w /workspace \
            sunuefi-builder bash -euc '
              git config --global --add safe.directory /workspace
              git config --global --add safe.directory "/workspace/*"
              python3 -m venv .venv
              .venv/bin/pip install --quiet --upgrade pip
              .venv/bin/pip install --quiet -r requirements-build.txt
              ./build.sh sources
              ./build.sh uefi
            '

      - name: Inspect UEFI artifacts
        working-directory: sunuefi
        run: |
          set -euo pipefail
          # 容器以 root 写入产物，检查与打包都要 sudo。
          sudo ls -lh artifacts/product/
          sudo cat artifacts/product/manifest.json 2>/dev/null || true

      - name: Package UEFI artifacts
        working-directory: sunuefi
        run: |
          set -euo pipefail
          sudo tar -I 'zstd -10 -T0' -cf "$GITHUB_WORKSPACE/uefi-product.tar.zst" \
            -C artifacts/product .
          sudo chown "$(id -u):$(id -g)" "$GITHUB_WORKSPACE/uefi-product.tar.zst"
          ls -lh "$GITHUB_WORKSPACE"/uefi-product.tar.zst

      - uses: actions/upload-artifact@v4
        with:
          name: uefi-product
          path: uefi-product.tar.zst
          retention-days: 14
          compression-level: 1
